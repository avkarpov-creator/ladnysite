name: Check static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check-site.py
      - run: bash -n scripts/deploy-site.sh
      - run: node --check site/js/site.js

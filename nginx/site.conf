server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    # демо-сайты не индексируем (дублирует meta robots)
    location /demo/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri/ =404;
    }
}
